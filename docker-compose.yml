services:
  db:
    image: postgres:16
    container_name: electronic_retail_db
    volumes:
      - /var/lib/postgresql/data/
    env_file:
      - ./.env

  web:
    build: .
    container_name: electronic_retail_web
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - ./.env
    depends_on:
      - db

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
